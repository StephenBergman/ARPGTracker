name: Release Windows application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ARPG Seasons v__VERSION__
          releaseBody: |
            ## Install on Windows
            Download the Windows x64 setup.exe file from Assets below, run it, and open ARPG Seasons from the Start menu. No developer tools are required. Setup installs for your Windows account without administrator access; internet may be needed to install WebView2.

            You do not need the Source code archives, .sig files, or latest.json. Closing the app hides it to the system tray; choose Exit from the tray to quit.

            [Installation and usage guide](https://github.com/StephenBergman/ARPGTracker#install-on-windows)

            Existing updater-enabled installations can choose Update and restart in Settings. Season data updates separately and does not require reinstalling.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
