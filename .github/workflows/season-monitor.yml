name: Monitor official season sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: season-data-publisher
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - id: scan
        run: node scripts/check-season-sources.mjs --write
      - name: Validate generated datasets
        run: npm test
      - name: Publish verified season information
        if: steps.scan.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasons.json src/data/default-seasons.json data/season-reviews.json
          git commit -m "Update season information and personal review queue"
          git push origin HEAD:main
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-source-report
          path: season-source-report.md
          if-no-files-found: ignore
      - if: steps.scan.outputs.alerts == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = 'Season data may need an update';
            const report = fs.readFileSync('season-source-report.md', 'utf8');
            const marker = `<!-- season-monitor:${{ steps.scan.outputs.fingerprint }} -->`;
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'season-data' });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'season-data', color: 'b8860b', description: 'Official season information needs review'
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'season-data',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number
              });
              if (!comments.some(comment => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body: `${marker}\n${report}`
                });
              }
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['season-data'], body: `${marker}\n${report}`
              });
            }
      - name: Verify installed clients can download season data
        env:
          SEASON_DATA_URL: https://raw.githubusercontent.com/StephenBergman/ARPGTracker/main/data/seasons.json
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(process.env.SEASON_DATA_URL, { signal: AbortSignal.timeout(20000) });
          if (!response.ok) throw new Error(`Public season-data endpoint returned HTTP ${response.status}. Installed clients cannot refresh. Check repository visibility and the main/data/seasons.json path.`);
          const dataset = await response.json();
          if (dataset.schemaVersion !== 1 || !dataset.games?.projectDiablo2) throw new Error('Public endpoint did not return the expected season dataset.');
          console.log(`Public season dataset is accessible: ${dataset.updatedAt}`);
          JS
